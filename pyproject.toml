[project]
name = "reasonbook"
version = "1.0.0"
description = "Reasonbook — fraud prevention framework for federal and state grants"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Chris Johnson" }]

dependencies = [
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "apscheduler>=3.11.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.2.1",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "gunicorn>=23.0.0",
    "reportlab>=4.2.5",
]

[project.optional-dependencies]
# PostgreSQL driver — only needed when REASONBOOK_DATABASE_URL points at
# PostgreSQL. SQLite (the default) uses the stdlib sqlite3 driver.
postgres = ["psycopg[binary]>=3.2.3"]
# S3-compatible attachment storage — only needed when
# REASONBOOK_ATTACHMENT_BACKEND=s3. Local filesystem is the default.
s3 = ["boto3>=1.35.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml",
    "psycopg[binary]>=3.2.3",
    "boto3>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reasonbook"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["migrations/versions/"]
plugins = []

[[tool.mypy.overrides]]
module = ["flask_cors.*", "reportlab.*", "boto3.*", "botocore.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
